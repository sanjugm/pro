apiVersion: apps/v1
kind: Deployment

metadata:
  name: req4-api

spec:
  replicas: 2

  selector:
    matchLabels:
      app: req4-api

  template:
    metadata:
      labels:
        app: req4-api

    spec:
      containers:
        - name: req4-api

          image: q4telemetryacr2026.azurecr.io/req4-telemetry-to-bug:latest

          ports:
            - containerPort: 8080

          env:
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: q4-appinsights
                  key: connection-string

            - name: PORT
              value: "8080"

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"